services:
  enterprise-architect:
    profiles:
      - pipeline
    platform: linux/amd64
    image: evbodanov/enterprise-architect-wine:v1
    container_name: enterprise-architect
    shm_size: "1gb"
    ports:
      - "127.0.0.1:6080:6080"
    volumes:
      - enterprise-architect-wine:/home/ea/.wine
      - ./enterprise-architect:/home/ea/.wine/drive_c/users/ea/Documents/enterprise-architect
      - ./pipeline/enterprise-architect/input:/home/ea/.wine/drive_c/users/ea/Documents/enterprise-architect/input
      - ./pipeline/enterprise-architect/output:/home/ea/.wine/drive_c/users/ea/Documents/enterprise-architect/output
    environment:
      SCREEN_RESOLUTION: "1600x900x24"

  sysml-kernel:
    profiles:
      - pipeline
    image: csba184/sysml.jupyter:latest
    container_name: sysml-kernel-container
    tty: true
    stdin_open: true
    entrypoint: []
    command: >
      conda run --no-capture-output -n sysml
      jupyter kernel --kernel=sysml --ip=0.0.0.0
    ports:
      - "127.0.0.1:8888:8888"
    environment:
      SYSML_API_SERVER: "http://sysmlapiserver:9000"

  fed-sysml:
    profiles:
      - pipeline
    image: evbodanov/fed-sysml:v1
    container_name: fed-sysml
    environment:
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"
      AWS_REGION: "${AWS_REGION:-}"
      AWS_DEFAULT_REGION: "${AWS_DEFAULT_REGION:-}"
      TF_IN_AUTOMATION: "${TF_IN_AUTOMATION:-true}"
    volumes:
      - ./pipeline/fed-sysml/input:/pipeline/input
      - ./pipeline/fed-sysml/output:/pipeline/output
      - type: bind
        source: ${FED_SYSML_CODE_HOST_DIR:-./digital-twin-manager/testLambdaFunctions}
        target: /pipeline/code
        read_only: true

  digital-twin-profile-sysml-v1:
    profiles:
      - pipeline
    image: evbodanov/digital-twin-profile-sysml-v1:v1
    container_name: digital-twin-profile-sysml-v1
    environment:
      DTP_PATH_MAP: "${DTP_PATH_MAP:-}"
    volumes:
      - ./pipeline/digital-twin-profile-sysml-v1/input:/pipeline/input
      - ./pipeline/digital-twin-profile-sysml-v1/output:/pipeline/output
      - type: bind
        source: ${PIPELINE_CODE_HOST_DIR:-./demo-code}
        target: /pipeline/code
        read_only: true

  digital-twin-profile-sysml-v2:
    profiles:
      - pipeline
    image: evbodanov/digital-twin-profile-sysml-v2:v1
    container_name: digital-twin-profile-sysml-v2
    depends_on:
      - sysml-kernel
    environment:
      SYSML_KERNEL_CONTAINER: "sysml-kernel-container"
      DTP_PATH_MAP: "${DTP_PATH_MAP:-}"
    volumes:
      - ./pipeline/digital-twin-profile-sysml-v2/input:/pipeline/input
      - ./pipeline/digital-twin-profile-sysml-v2/output:/pipeline/output
      - /var/run/docker.sock:/var/run/docker.sock
      - type: bind
        source: ${PIPELINE_CODE_HOST_DIR:-./demo-code}
        target: /pipeline/code
        read_only: true

  digital-twin-manager:
    profiles:
      - pipeline
    image: evbodanov/digital-twin-manager:v1
    container_name: digital-twin-manager
    stdin_open: true
    tty: true
    environment:
      DIGITAL_TWIN_MANAGER_CONFIG_DIR: "/pipeline/input"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"
      AWS_REGION: "${AWS_REGION:-}"
      AWS_DEFAULT_REGION: "${AWS_DEFAULT_REGION:-}"
    volumes:
      - ./pipeline/digital-twin-manager/input:/pipeline/input
      - ./pipeline/digital-twin-manager/output:/pipeline/output
      - type: bind
        source: ${PIPELINE_CODE_HOST_DIR:-./demo-code}
        target: /pipeline/code
  cloud-deployer-test-simulator:
    image: evbodanov/cloud-deployer-test-simulator:v1
    profiles:
      - simulator
    environment:
      SIMULATOR_MOCK_AWS: "${SIMULATOR_MOCK_AWS:-true}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"
      AWS_REGION: "${AWS_REGION:-eu-central-1}"
    volumes:
      - type: bind
        source: ${SIMULATOR_INPUT_HOST_DIR:-./pipeline/digital-twin-manager/input}/config.json
        target: /app/config.json
        read_only: true
      - type: bind
        source: ${SIMULATOR_INPUT_HOST_DIR:-./pipeline/digital-twin-manager/input}/config_hierarchy.json
        target: /app/config_hierarchy.json
        read_only: true
      - type: bind
        source: ${SIMULATOR_INPUT_HOST_DIR:-./pipeline/digital-twin-manager/input}/config_iot_devices.json
        target: /app/config_iot_devices.json
        read_only: true
    ports:
      - "127.0.0.1:${SIMULATOR_HOST_PORT:-5000}:5000"

volumes:
  enterprise-architect-wine:
